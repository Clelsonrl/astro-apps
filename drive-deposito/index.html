<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrolábio Depósito</title>
  <style>
    /* Essential styles for a true full-screen experience */
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Prevent parent page from scrolling */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Replaces frameborder="0" */
      display: block;
      /* Removes any potential whitespace below the iframe */
    }
  </style>
</head>

<body>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz0sbSZabLugE_FFgYxkDkAekef81X2gv097FrssxcBJEXC0AKixOH8Yy7IND0if81O/exec"
    allow="clipboard-read; clipboard-write"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      if (frame) {
        var baseSrc = frame.getAttribute('src');
        var separator = baseSrc.indexOf('?') !== -1 ? '&' : '?';
        var currentWrapperUrl = window.location.href.split('?')[0].split('#')[0];
        var queryParams = ['wrapperUrl=' + encodeURIComponent(currentWrapperUrl)];

        if (window.location.search) {
          var search = window.location.search.replace(/^\?/, '');
          if (search) {
            queryParams.push(search);
          }
        }

        frame.src = baseSrc + separator + queryParams.join('&');
      }

      // Synchronize browser address bar with in-app navigation
      window.addEventListener('message', function (event) {
        if (!event || !event.data || event.data.type !== 'DEPOSITO_NAVIGATE') return;
        var item = event.data.item;
        var cleanUrl = window.location.href.split('?')[0].split('#')[0];
        var hash = window.location.hash || '';
        if (item && item !== 'root') {
          var newUrl = cleanUrl + '?item=' + encodeURIComponent(item) + hash;
          window.history.replaceState(null, '', newUrl);
        } else {
          window.history.replaceState(null, '', cleanUrl + hash);
        }
      });
    })();
  </script>
</body>

</html>
