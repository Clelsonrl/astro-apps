<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrolábio Depósito</title>
  <style>
    /* Essential styles for a true full-screen experience */
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Prevent parent page from scrolling */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Replaces frameborder="0" */
      display: block;
      /* Removes any potential whitespace below the iframe */
    }
  </style>
</head>

<body>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz0sbSZabLugE_FFgYxkDkAekef81X2gv097FrssxcBJEXC0AKixOH8Yy7IND0if81O/exec"
    allow="clipboard-read; clipboard-write"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      if (frame && window.location.search) {
        var baseSrc = frame.getAttribute('src');
        var separator = baseSrc.indexOf('?') !== -1 ? '&' : '?';
        var search = window.location.search.replace(/^\?/, '');
        frame.src = baseSrc + separator + search;
      }
    })();
  </script>
</body>

</html>
