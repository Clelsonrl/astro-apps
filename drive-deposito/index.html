<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrolábio Depósito</title>
  <style>
    /* Essential styles for a true full-screen experience */
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Prevent parent page from scrolling */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Replaces frameborder="0" */
      display: block;
      /* Removes any potential whitespace below the iframe */
    }
  </style>
</head>

<body>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz0sbSZabLugE_FFgYxkDkAekef81X2gv097FrssxcBJEXC0AKixOH8Yy7IND0if81O/exec"
    allow="clipboard-read; clipboard-write"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('appFrame');
      if (frame) {
        var baseSrc = frame.getAttribute('src');
        var separator = baseSrc.indexOf('?') !== -1 ? '&' : '?';
        var currentWrapperUrl = window.location.href.split('?')[0].split('#')[0];
        var queryParams = ['wrapperUrl=' + encodeURIComponent(currentWrapperUrl)];

        if (window.location.search) {
          var search = window.location.search.replace(/^\?/, '');
          if (search) {
            queryParams.push(search);
          }
        }

        frame.src = baseSrc + separator + queryParams.join('&');
      }

      var appPort = null;
      var lastReportedItem = null;
      var hasInitialStatePushed = false;

      function handleNavFromApp(item) {
        if (item === 'root') item = null;
        if (item === lastReportedItem) return;
        lastReportedItem = item;

        var cleanUrl = window.location.href.split('?')[0].split('#')[0];
        var hash = window.location.hash || '';
        var newUrl = cleanUrl + (item ? '?item=' + encodeURIComponent(item) : '') + hash;

        if (!hasInitialStatePushed) {
          hasInitialStatePushed = true;
          console.log('[Depósito Wrapper] Replacing initial state:', item, newUrl);
          window.history.replaceState({ item: item }, '', newUrl);
        } else {
          console.log('[Depósito Wrapper] Pushing history state:', item, newUrl);
          window.history.pushState({ item: item }, '', newUrl);
        }
      }

      // Synchronize browser address bar with in-app navigation
      window.addEventListener('message', function (event) {
        if (!event || !event.data) return;

        // MessageChannel handshake
        if (event.data.type === 'DEPOSITO_CONNECT' && event.ports && event.ports[0]) {
          appPort = event.ports[0];
          appPort.onmessage = function (e) {
            if (e.data && e.data.type === 'DEPOSITO_NAVIGATE') {
              handleNavFromApp(e.data.item);
            }
          };
          console.log('[Depósito Wrapper] Direct MessageChannel connected with app');
          return;
        }

        // Direct postMessage fallback
        if (event.data.type === 'DEPOSITO_NAVIGATE') {
          handleNavFromApp(event.data.item);
        }
      });

      // Browser Back/Forward navigation
      window.addEventListener('popstate', function (event) {
        var targetItem = (event.state && typeof event.state.item !== 'undefined')
          ? event.state.item
          : (new URLSearchParams(window.location.search).get('item') || null);
        if (targetItem === 'root') targetItem = null;
        lastReportedItem = targetItem;
        console.log('[Depósito Wrapper] popstate detected, navigating app to:', targetItem);
        if (appPort) {
          appPort.postMessage({ type: 'NAVIGATE_TO', item: targetItem });
        }
      });
    })();
  </script>
</body>

</html>
